<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خطة المذاكرة</title>
<style>
:root{--bg:#f3f5ff;--card:#fff;--tx:#1b1f3b;--mu:#6b7194;--ac:#6c5ce7;--ac2:#00c2a8;--bd:#e3e6f8;--lab:#ff7a59;--box:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1020;--card:#171a33;--tx:#eef0ff;--mu:#9aa0c8;--bd:#2a2e54;--box:#10132a;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:16px 14px 40px;max-width:560px;margin-inline:auto}
header{background:linear-gradient(135deg,var(--ac),#a29bfe);color:#fff;border-radius:22px;padding:18px;animation:in .6s both}
h1{margin:0 0 4px;font-size:22px}
.sub{opacity:.9;font-size:13px}
.bar{height:10px;background:rgba(255,255,255,.3);border-radius:9px;margin-top:14px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#fff;border-radius:9px;transition:width .5s cubic-bezier(.2,.9,.3,1.2)}
.pct{font-size:13px;margin-top:6px;display:flex;justify-content:space-between}
.day{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-top:14px;animation:in .6s both}
.day:nth-of-type(2){animation-delay:.08s}.day:nth-of-type(3){animation-delay:.16s}.day:nth-of-type(4){animation-delay:.24s}.day:nth-of-type(5){animation-delay:.32s}
.dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dh b{font-size:17px}.dh span{font-size:12px;color:var(--mu)}
.exam{display:inline-block;background:var(--lab);color:#fff;border-radius:9px;padding:2px 9px;font-size:12px;margin-top:2px}
.g{padding:10px 0;border-top:1px dashed var(--bd)}
.gn{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.t{font-size:11px;padding:2px 8px;border-radius:8px;background:var(--ac);color:#fff;font-weight:500}
.t.l{background:var(--lab)}
.bx{display:flex;flex-wrap:wrap;gap:10px}
.b{width:44px;height:44px;border-radius:13px;border:2px solid var(--bd);background:var(--box);color:var(--mu);font-size:15px;font-weight:600;display:grid;place-items:center;cursor:pointer;transition:.2s;font-family:inherit;padding:0}
.b:active{transform:scale(.9)}
.b.on{background:linear-gradient(135deg,var(--ac2),#2ee6c8);border-color:transparent;color:#fff;animation:pop .35s}
.b.on::after{content:"✓";font-size:22px}
.b.on span{display:none}
.g.done .gn::after{content:"تمام 🎉";margin-inline-start:auto;color:var(--ac2);font-size:12px}
.r{margin-top:18px;text-align:center}
.r button{border:0;background:none;color:var(--mu);font-size:12px;text-decoration:underline;font-family:inherit}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
</style>
</head>
<body>
<header>
<h1>خطة المذاكرة 📚</h1>
<div class="sub">اللاب الأحد 1/11 · المحاضرات الثلاثاء 3/11</div>
<div class="bar"><i id="pb"></i></div>
<div class="pct"><span id="pt">0 من 0</span><span id="pp">0%</span></div>
</header>
<main id="m"></main>
<div class="r"><button id="rs">مسح كل العلامات</button></div>
<script>
var D=[
{d:"الجمعة",dt:"30/10",g:[["Anatomy","l",4],["Histo","l",2],["Anatomy","c",[2,3,4,5]]]},
{d:"السبت",dt:"31/10",g:[["Patho","l",2],["Physio","l",2],["Pharma","l",1],["Micro","l",1],["Anatomy","c",[6,7]],["Histo","c",[1,2]]]},
{d:"الأحد",dt:"1/11",ex:"امتحان اللاب",g:[["Histo","c",[3]],["Physio","c",[1,2,3,4]],["Bio","c",[1,2]],["Micro","c",[1]]]},
{d:"الاثنين",dt:"2/11",g:[["Micro","c",[2]],["Pharma","c",[1,2,3]],["Patho","c",[1,2]],["Integrated","c",[1,2]]]},
{d:"الثلاثاء",dt:"3/11",ex:"امتحان المحاضرات",g:[["مراجعة سريعة","c",[1]]]}
];
var S={};
function ld(){try{S=JSON.parse(localStorage.getItem("sp1")||"{}")}catch(e){S={}}}
function sv(){try{localStorage.setItem("sp1",JSON.stringify(S))}catch(e){}}
function up(){var a=document.querySelectorAll(".b"),n=0;a.forEach(function(b){if(S[b.dataset.k])n++});
var p=a.length?Math.round(n/a.length*100):0;
document.getElementById("pb").style.width=p+"%";
document.getElementById("pt").textContent=n+" من "+a.length;
document.getElementById("pp").textContent=p+"%";
document.querySelectorAll(".g").forEach(function(g){var x=g.querySelectorAll(".b"),o=g.querySelectorAll(".b.on");g.classList.toggle("done",x.length===o.length)})}
function build(){var m=document.getElementById("m");m.innerHTML="";
D.forEach(function(day,i){var c=document.createElement("section");c.className="day";
c.innerHTML='<div class="dh"><b>'+day.d+'</b><span>'+day.dt+'</span></div>'+(day.ex?'<span class="exam">'+day.ex+'</span>':'');
day.g.forEach(function(g,j){var w=document.createElement("div");w.className="g";
var nums=typeof g[2]==="number"?Array.from({length:g[2]},function(_,k){return k+1}):g[2];
w.innerHTML='<div class="gn">'+g[0]+' <span class="t'+(g[1]==="l"?" l":"")+'">'+(g[1]==="l"?"لاب":"محاضرة")+'</span></div><div class="bx"></div>';
var bx=w.querySelector(".bx");
nums.forEach(function(n){var b=document.createElement("button");var k=i+"-"+j+"-"+n;b.dataset.k=k;b.className="b"+(S[k]?" on":"");b.innerHTML="<span>"+n+"</span>";
b.onclick=function(){S[k]=!S[k];b.classList.toggle("on",S[k]);sv();up();if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}};bx.appendChild(b)});
c.appendChild(w)});m.appendChild(c)});up()}
document.getElementById("rs").onclick=function(){if(confirm("تمسح كل العلامات؟")){S={};sv();build()}};
ld();build();
</script>
</body>
</html>
